{% extends 'base.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist · Time Store</title>

    <!-- Favicon -->
    <link rel="icon"
          type="image/svg+xml"
          href="{% static 'images/favicon.svg' %}">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{% static 'css/wishlist.css' %}">
</head>

<body>
{% block content %}




    <!-- MAIN CONTENT -->
    <main>

        <!-- PAGE HEADER -->
        <section class="page-header">

            <div class="container">

                <div class="eyebrow">
                    Kept close
                </div>

                <h1>
                    Your Saved Watches
                </h1>

            </div>

        </section>


        <!-- WISHLIST PRODUCTS -->
        <section class="section">

            <div class="container">

                <div class="product-grid">


                    <!-- PRODUCT 1 -->
                    <a href="/product-detail/?id=rolex-submariner-date"
                       class="product-card">

                        <div class="product-image">

                            <span class="product-tag">
                                Iconic
                            </span>


                            <span class="heart-button saved"
                                  aria-label="Wishlist">

                                <svg width="15"
                                     height="15"
                                     viewBox="0 0 24 24"
                                     fill="currentColor"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5
                                    A5.5 5.5 0 0 0 16.5 3
                                    c-1.76 0-3 .5-4.5 2
                                    -1.5-1.5-2.74-2-4.5-2
                                    A5.5 5.5 0 0 0 2 8.5
                                    c0 2.3 1.5 4.05 3 5.5l7 7Z">
                                    </path>

                                </svg>

                            </span>


                            <img src="{% static 'images/rolex-submariner.jpg' %}"
                                 alt="Rolex Submariner Date">

                        </div>


                        <div class="product-copy">

                            <div class="product-brand">
                                Rolex
                            </div>

                            <h3 class="product-name">
                                Submariner Date
                            </h3>

                            <div class="product-meta">

                                <div class="product-price">
                                    ₹13,850
                                </div>

                                <div class="availability">
                                    Ready to ship
                                </div>

                            </div>

                        </div>

                    </a>


                    <!-- PRODUCT 2 -->
                    <a href="/product-detail/?id=patek-nautilus"
                       class="product-card">

                        <div class="product-image">

                            <span class="product-tag">
                                Collector’s piece
                            </span>


                            <span class="heart-button saved"
                                  aria-label="Wishlist">

                                <svg width="15"
                                     height="15"
                                     viewBox="0 0 24 24"
                                     fill="currentColor"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     stroke-linecap="round"
                                     stroke-linejoin="round">

                                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5
                                    A5.5 5.5 0 0 0 16.5 3
                                    c-1.76 0-3 .5-4.5 2
                                    -1.5-1.5-2.74-2-4.5-2
                                    A5.5 5.5 0 0 0 2 8.5
                                    c0 2.3 1.5 4.05 3 5.5l7 7Z">
                                    </path>

                                </svg>

                            </span>


                            <img src="{% static 'images/patek-nautilus.jpg' %}"
                                 alt="Patek Philippe Nautilus 5711">

                        </div>


                        <div class="product-copy">

                            <div class="product-brand">
                                Patek Philippe
                            </div>

                            <h3 class="product-name">
                                Nautilus 5711
                            </h3>

                            <div class="product-meta">

                                <div class="product-price">
                                    ₹89,500
                                </div>

                                <div class="availability">
                                    By private appointment
                                </div>

                            </div>

                        </div>

                    </a>

                </div>

            </div>

        </section>

    </main>
    {% endblock %}


    



</body>
</html>
