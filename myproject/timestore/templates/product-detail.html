{% extends 'base.html' %}


{% block content %}


<div class="container mt-5">


    <div class="card mb-3">


        <div class="row g-0">


            <div class="col-md-4">


                <img src="{{ product.image.url }}"
                     class="img-fluid rounded-start">


            </div>


            <div class="col-md-8">


                <div class="card-body">


                    <h5 class="card-title">
                        {{ product.name }}
                    </h5>


                    <p class="card-text">
                        {{ product.description }}
                    </p>




                    {% if product.is_sale %}


                        <strike>
                            ${{ product.price }}
                        </strike>


                        &nbsp;


                        ${{ product.sale_price }}


                    {% else %}


                        ${{ product.price }}


                    {% endif %}




                    <br><br>




                    <div class="row">


                        <div class="col-md-2">
                            Quantity
                        </div>


                        <div class="col-md-3">


                            <select class="form-select"
                                    id="qty-cart">


                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>


                            </select>


                        </div>


                    </div>




                    <br>




                    <button type="button"
                            value="{{ product.id }}"
                            class="btn btn-secondary"
                            id="add-cart">


                        Add to Cart


                    </button>


                </div>


            </div>


        </div>


    </div>


</div>



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>


$(document).on('click', '#add-cart', function(e) {


    e.preventDefault();


    $.ajax({


        type: 'POST',


        url: "{% url 'cart_add' %}",


        data: {


            product_id: $('#add-cart').val(),


            product_qty: $('#qty-cart').val(),


            csrfmiddlewaretoken: '{{ csrf_token }}'


        },


        success: function(json) {


            document.getElementById('cart_quantity').textContent = json.qty;


        },


        error: function(xhr, errmsg, err) {


            console.log(xhr.responseText);


        }


    });


});


</script>





{% endblock %}
